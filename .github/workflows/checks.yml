name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same checks before publishing.
  workflow_call:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  versions:
    name: Version files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Every version file carries the same version
        run: node tools/version.mjs check

  tests:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux covers every supported Node line (engines: >=18). macOS and
        # Windows cover the case-insensitive path handling and Windows paths.
        os: [ubuntu-latest]
        node: ['18', '20', '22', '24', '26']
        include:
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Git-dependent integration tests skip themselves on Windows unless
      # TAVERNGIT_TEST_GIT names a git.exe; use the runner's Git for Windows.
      - name: Tests
        shell: bash
        env:
          TAVERNGIT_TEST_GIT: ${{ runner.os == 'Windows' && 'C:\Program Files\Git\cmd\git.exe' || '' }}
        run: >-
          npm test --
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./tools/gha-reporter.mjs --test-reporter-destination=stdout
